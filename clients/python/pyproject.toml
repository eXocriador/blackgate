[project]
name = "exo-ai-client"
version = "0.1.0"
license = "MIT"
description = "Python-клієнт exo-ai — шлюзу до моделей"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exo_ai_client"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
# Коментарі й docstring-и українською: кирилиця тут не «схожа літера», а мова.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
